<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriGuide Farmer Chatbot / రైతు సహాయక చాట్‌బాట్</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#eef8f0;color:#2c3e50;min-height:100vh}
nav{background:#176b3a;padding:16px 30px;color:white;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
nav h2{font-size:22px}
nav a{color:white;text-decoration:none;margin-left:15px;font-weight:500}
.container{width:94%;max-width:950px;margin:20px auto}
h1{text-align:center;color:#176b3a;margin-bottom:14px;font-size:26px}
.top-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:white;padding:12px 18px;border-radius:12px;border:1px solid #ddd;margin-bottom:15px}
.control-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.control-group label{font-size:14px;font-weight:600;color:#176b3a}
#language{padding:8px 14px;border-radius:8px;border:1.5px solid #176b3a;background:white}
.switch-container{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.switch-container input{width:18px;height:18px;accent-color:#176b3a}
.chips-container{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:15px}
.chip{background:#e0f2e9;color:#137333;border:1px solid #b7dfca;padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.chat-box{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;min-height:350px;max-height:520px;overflow-y:auto;box-shadow:0 4px 15px #0000000f;display:flex;flex-direction:column;gap:12px}
.message{padding:14px 18px;border-radius:14px;font-size:15.5px;line-height:1.6;max-width:88%;overflow-wrap:anywhere}
.bot{background:#f0f9f3;color:#1e3a29;border:1px solid #d4ecd9;margin-right:auto;border-bottom-left-radius:4px}
.user{background:#176b3a;color:white;margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
.bot ul,.bot ol{margin:6px 0 6px 20px}
.msg-audio-bar{margin-top:10px;padding-top:8px;border-top:1px dashed #176b3a33;display:flex;gap:8px}
.tts-btn{background:white;border:1px solid #176b3a;color:#176b3a;padding:5px 10px;border-radius:6px;cursor:pointer}
.tts-btn.playing{background:#d93829;color:white}
.input-area{display:flex;gap:10px;margin-top:15px}
.input-wrapper{position:relative;flex:1}
#messageInput{width:100%;padding:14px 48px 14px 16px;font-size:15px;border:1.5px solid #bbb;border-radius:10px;outline:none}
#messageInput:focus{border-color:#176b3a}
#messageInput.voice-active{border-color:#d93829}
.mic-inside-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:transparent;border:0;font-size:20px;cursor:pointer;padding:7px}
.main-btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
#sendButton{background:#176b3a;color:white}
#sendButton:disabled{opacity:.6;cursor:wait}
.action-buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
#speakButton{background:#2b7a4b;color:white}
#speakButton.recording{background:#d93829}
#imageButton{background:#6a3ab2;color:white}
#stopSpeechBtn{background:#5f6368;color:white;display:none}
.voice-status-bar{display:none;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #d93829;border-radius:10px;padding:10px;margin-top:10px;flex-wrap:wrap}
.voice-status-left{color:#d93829;font-weight:600;font-size:14px}
.voice-status-actions{display:flex;gap:8px}
.voice-action-btn{border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.btn-done-send{background:#176b3a;color:white}
.btn-cancel-rec{background:#eee;color:#333}
#status{margin-top:10px;color:#555;font-size:14px;text-align:center;min-height:20px}
#imageInput{display:none}
.uploaded-preview-img{max-width:220px;max-height:180px;border-radius:8px;margin-top:8px;border:2px solid #ddd;display:block}
@media(max-width:700px){nav{padding:14px;align-items:flex-start}nav a{margin-left:0;margin-right:12px}.container{width:96%}.input-area{flex-direction:column}.action-buttons{flex-direction:column}.action-buttons button{width:100%}.top-controls{align-items:flex-start;flex-direction:column}.message{max-width:95%}}
</style>
</head>
<body>
<nav>
<h2>🌱 AgriGuide</h2>
<div><a href="/">Home</a><a href="/dashboard">Dashboard</a><a href="/recommendation">Crop Recommendation</a></div>
</nav>

<div class="container">
<h1>🌾 AgriGuide Farmer Chatbot / రైతు చాట్‌బాట్</h1>

<div class="top-controls">
<div class="control-group">
<label for="language">🌐 Language / భాష:</label>
<select id="language">
<option value="en-IN">English (India)</option>
<option value="en-US">English (US)</option>
<option value="te-IN">తెలుగు (Telugu)</option>
</select>
</div>
<label class="switch-container"><input type="checkbox" id="autoSpeechToggle" checked> 🔊 Auto Read Aloud / సమాధానాన్ని చదవండి</label>
</div>

<div class="chips-container">
<button class="chip" onclick="useChip('వరిలో ఎరువుల యాజమాన్యం ఎలా చేయాలి?')">🌾 వరిలో ఎరువులు</button>
<button class="chip" onclick="useChip('పత్తిలో గులాబీ రంగు పురుగు నివారణ పద్ధతులు?')">🐛 పత్తి పురుగు</button>
<button class="chip" onclick="useChip('మిరపలో ముడత తెగులు గురించి చెప్పండి')">🌶️ మిరప సమస్యలు</button>
<button class="chip" onclick="useChip('Best fertilizer for cotton crop in black soil?')">🌱 Cotton Fertilizer</button>
<button class="chip" onclick="useChip('Nalla regadi nela lo kharif lo em panta veyali?')">💬 Tanglish Query</button>
</div>

<div id="chatBox" class="chat-box">
<div class="message bot" id="welcomeBotMsg">
<div>నమస్కారం రైతు సోదరా! 👋<br>మీ వ్యవసాయ ప్రశ్నను తెలుగులో లేదా ఇంగ్లీషులో టైప్ చేయండి, మాట్లాడండి, లేదా పంట ఆకు ఫోటోను అప్‌లోడ్ చేయండి.</div>
<div class="msg-audio-bar"><button class="tts-btn" onclick="toggleMessageSpeech(this)">🔊 Listen / వినండి</button></div>
</div>
</div>

<div class="input-area">
<div class="input-wrapper">
<input type="text" id="messageInput" placeholder="Type or speak your farming question...">
<button type="button" id="micInsideBtn" class="mic-inside-btn" onclick="startListening()" title="Speak">🎤</button>
</div>
<button id="sendButton" class="main-btn" onclick="sendMessage()">Send / పంపండి</button>
</div>

<div id="voiceStatusBar" class="voice-status-bar">
<div class="voice-status-left"><span id="voiceStatusMsg">🎤 Listening... / వింటున్నాను...</span></div>
<div class="voice-status-actions">
<button class="voice-action-btn btn-done-send" onclick="stopListening()">Done / పూర్తయింది</button>
<button class="voice-action-btn btn-cancel-rec" onclick="cancelVoiceRecording()">Cancel / రద్దు</button>
</div>
</div>

<div class="action-buttons">
<button id="speakButton" class="main-btn" onclick="startListening()">🎤 Speak / మాట్లాడండి</button>
<button id="imageButton" class="main-btn" onclick="selectImage()">🖼️ Upload Crop Photo</button>
<button id="stopSpeechBtn" class="main-btn" onclick="stopAllSpeech()">⏹️ Stop Voice / ఆపండి</button>
</div>

<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" onchange="imageSelected()">
<div id="status" role="status" aria-live="polite"></div>
</div>

<script>
const languageSelect=document.getElementById("language");
const autoSpeechToggle=document.getElementById("autoSpeechToggle");
const messageInput=document.getElementById("messageInput");
const chatBox=document.getElementById("chatBox");
const statusText=document.getElementById("status");
const sendBtn=document.getElementById("sendButton");
const speakBtn=document.getElementById("speakButton");
const micInsideBtn=document.getElementById("micInsideBtn");
const stopSpeechBtn=document.getElementById("stopSpeechBtn");
const voiceStatusBar=document.getElementById("voiceStatusBar");
const voiceStatusMsg=document.getElementById("voiceStatusMsg");
const imageInput=document.getElementById("imageInput");

let conversationHistory=[];
let recognition=null;
let isListening=false;
let activeTtsBtn=null;
let availableVoices=[];

function loadVoices(){
 if("speechSynthesis" in window) availableVoices=window.speechSynthesis.getVoices();
}
if("speechSynthesis" in window){
 loadVoices();
 window.speechSynthesis.onvoiceschanged=loadVoices;
}

function useChip(text){messageInput.value=text;sendMessage();}

function formatMarkdown(text){
 if(!text)return "";
 let safe=String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 safe=safe.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
 const lines=safe.split("\n");
 let result=[],inList=false;
 for(const line of lines){
  const trimmed=line.trim();
  if(trimmed.startsWith("- ")||trimmed.startsWith("* ")){
   if(!inList){result.push("<ul>");inList=true;}
   result.push("<li>"+trimmed.slice(2)+"</li>");
  }else{
   if(inList){result.push("</ul>");inList=false;}
   result.push(line);
  }
 }
 if(inList)result.push("</ul>");
 return result.join("<br>");
}

function cleanTextForSpeech(text){
 return String(text||"").replace(/<[^>]*>/g," ").replace(/\*\*(.*?)\*\*/g,"$1").replace(/[*#_`~]/g,"").replace(/https?:\/\/\S+/g,"").replace(/[\u{1F300}-\u{1FAFF}]/gu,"").replace(/\s+/g," ").trim();
}

function stopAllSpeech(){
 if("speechSynthesis" in window)window.speechSynthesis.cancel();
 if(activeTtsBtn){activeTtsBtn.classList.remove("playing");activeTtsBtn.innerText="🔊 Listen / వినండి";activeTtsBtn=null;}
 stopSpeechBtn.style.display="none";
}

function speakText(text,language,button=null){
 if(!("speechSynthesis" in window))return;
 stopAllSpeech();
 const clean=cleanTextForSpeech(text);
 if(!clean)return;
 const telugu=(language==="te"||language==="te-IN"||/[\u0C00-\u0C7F]/.test(clean));
 const targetLang=telugu?"te-IN":"en-IN";
 loadVoices();
 let voice=availableVoices.find(v=>v.lang.toLowerCase()===targetLang.toLowerCase());
 if(!voice)voice=availableVoices.find(v=>v.lang.toLowerCase().startsWith(telugu?"te":"en"));
 // If a Telugu voice is not installed, leave the Telugu answer visible instead of showing a false error.
 if(telugu&&!voice)return;
 if(button){activeTtsBtn=button;button.classList.add("playing");button.innerText="⏹️ Stop / ఆపండి";}
 stopSpeechBtn.style.display="inline-flex";
 const utterance=new SpeechSynthesisUtterance(clean);
 utterance.lang=targetLang;
 utterance.rate=telugu?0.9:0.95;
 if(voice)utterance.voice=voice;
 utterance.onend=()=>{if(activeTtsBtn===button)stopAllSpeech();};
 utterance.onerror=()=>stopAllSpeech();
 window.speechSynthesis.speak(utterance);
}

function toggleMessageSpeech(button){
 if(button.classList.contains("playing")){stopAllSpeech();return;}
 const parent=button.closest(".message");
 if(!parent)return;
 const copy=parent.cloneNode(true);
 const audio=copy.querySelector(".msg-audio-bar");
 if(audio)audio.remove();
 const text=copy.innerText;
 speakText(text,/[\u0C00-\u0C7F]/.test(text)?"te-IN":"en-IN",button);
}

function addMessage(content,type,isHtml=false){
 const div=document.createElement("div");
 div.className="message "+type;
 const textContainer=document.createElement("div");
 if(isHtml)textContainer.innerHTML=content;
 else textContainer.innerText=content;
 div.appendChild(textContainer);
 if(type==="bot"){
  const audio=document.createElement("div");
  audio.className="msg-audio-bar";
  const btn=document.createElement("button");
  btn.className="tts-btn";
  btn.type="button";
  btn.innerText="🔊 Listen / వినండి";
  btn.onclick=()=>toggleMessageSpeech(btn);
  audio.appendChild(btn);
  div.appendChild(audio);
 }
 chatBox.appendChild(div);
 chatBox.scrollTop=chatBox.scrollHeight;
 return div;
}

async function sendMessage(){
 stopListening();
 stopAllSpeech();
 const message=messageInput.value.trim();
 if(!message)return;
 addMessage(message,"user");
 conversationHistory.push({role:"user",content:message});
 messageInput.value="";
 sendBtn.disabled=true;
 statusText.innerText="";
 const telugu=/[\u0C00-\u0C7F]/.test(message)||languageSelect.value.startsWith("te");
 const loading=addMessage(telugu?"సమాధానం సిద్ధమవుతోంది...":"Thinking...","bot");
 try{
  const response=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:message,history:conversationHistory})
  });
  let data;
  try{data=await response.json();}catch(e){data={};}
  if(!response.ok){
   loading.querySelector("div:first-child").innerText=data.reply||"The chatbot could not answer. Please try again.";
   statusText.innerText="";
   return;
  }
  if(!data.reply){
   loading.querySelector("div:first-child").innerText="No answer was returned. Please try again.";
   return;
  }
  loading.querySelector("div:first-child").innerHTML=formatMarkdown(data.reply);
  conversationHistory.push({role:"assistant",content:data.reply});
  if(autoSpeechToggle.checked){
   const btn=loading.querySelector(".tts-btn");
   speakText(data.reply,data.language||languageSelect.value,btn);
  }
 }catch(error){
  console.error("Chat request failed:",error);
  loading.querySelector("div:first-child").innerText="Sorry, I couldn't connect to the chatbot. Please check your internet connection and try again.";
  statusText.innerText="";
 }finally{
  sendBtn.disabled=false;
 }
}

messageInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.isComposing)sendMessage();});
languageSelect.addEventListener("change",()=>{
 messageInput.placeholder=languageSelect.value.startsWith("te")?"మీ వ్యవసాయ ప్రశ్నను టైప్ చేయండి లేదా మాట్లాడండి...":"Type or speak your farming question...";
 if(isListening)stopListening();
});

const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;

function setVoiceStatus(message,color="#176b3a"){
 voiceStatusMsg.innerText=message;
 statusText.style.color=color;
 statusText.innerText="";
}

function updateVoiceUI(active){
 isListening=active;
 micInsideBtn.classList.toggle("recording",active);
 micInsideBtn.innerText=active?"🔴":"🎤";
 speakBtn.classList.toggle("recording",active);
 speakBtn.innerText=active?"🔴 Listening...":"🎤 Speak / మాట్లాడండి";
 messageInput.classList.toggle("voice-active",active);
 voiceStatusBar.style.display=active?"flex":"none";
}

function stopListening(){
 if(recognition){
  try{recognition.stop();}catch(e){}
 }
 updateVoiceUI(false);
}

function cancelVoiceRecording(){
 if(recognition){try{recognition.abort();}catch(e){}}
 recognition=null;
 updateVoiceUI(false);
 messageInput.value="";
 statusText.innerText="";
}

function startListening(){
 if(!SpeechRecognitionAPI){
  setVoiceStatus("Voice input is not supported in this browser. Please type your question or try Chrome.", "#b45309");
  return;
 }
 if(isListening){stopListening();return;}
 stopAllSpeech();
 if(recognition){try{recognition.abort();}catch(e){}}
 try{
  recognition=new SpeechRecognitionAPI();
  recognition.lang=languageSelect.value;
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  let finalTranscript="";
  recognition.onstart=()=>{
   updateVoiceUI(true);
   messageInput.focus();
   setVoiceStatus("Listening... Please speak clearly. / వింటున్నాను...");
  };
  recognition.onresult=event=>{
   let interim="";
   for(let i=event.resultIndex;i<event.results.length;i++){
    const result=event.results[i];
    if(!result||!result[0])continue;
    if(result.isFinal)finalTranscript+=result[0].transcript+" ";
    else interim+=result[0].transcript;
   }
   const transcript=(finalTranscript+interim).trim();
   if(transcript)messageInput.value=transcript;
  };
  recognition.onerror=event=>{
   console.warn("Speech recognition issue:",event.error);
   // Do not show technical browser/network error strings to the user.
   if(event.error==="not-allowed"||event.error==="service-not-allowed"){
    setVoiceStatus("Please allow microphone access in your browser settings, or type your question.", "#b45309");
   }else if(event.error!=="aborted"&&event.error!=="no-speech"&&event.error!=="network"){
    setVoiceStatus("Voice input is temporarily unavailable. Please type your question.", "#b45309");
   }
  };
  recognition.onend=()=>{
   updateVoiceUI(false);
   recognition=null;
   if(messageInput.value.trim()){
    setVoiceStatus("Speech recognized. Review your question, then press Send.", "#176b3a");
   }else{
    statusText.innerText="";
   }
  };
  recognition.start();
 }catch(error){
  console.warn("Could not start speech recognition:",error);
  recognition=null;
  updateVoiceUI(false);
  setVoiceStatus("Voice input is temporarily unavailable. Please type your question.", "#b45309");
 }
}

async function selectImage(){imageInput.click();}

async function imageSelected(){
 const file=imageInput.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  statusText.innerText="Please select an image file.";
  imageInput.value="";
  return;
 }
 if(file.size>5*1024*1024){
  statusText.innerText="Please choose an image smaller than 5 MB.";
  imageInput.value="";
  return;
 }
 stopAllSpeech();
 const userBubble=addMessage("Uploaded crop photo: "+file.name,"user");
 const preview=document.createElement("img");
 preview.className="uploaded-preview-img";
 preview.alt="Selected crop photo";
 preview.src=URL.createObjectURL(file);
 userBubble.appendChild(preview);
 const loading=addMessage("🔍 Inspecting the crop photo...","bot");
 statusText.innerText="Analyzing crop photo... / పంట ఫోటోను పరిశీలిస్తోంది...";
 const formData=new FormData();
 formData.append("image",file);
 formData.append("caption",messageInput.value.trim());
 try{
  const response=await fetch("/chat-image",{method:"POST",body:formData});
  let data;
  try{data=await response.json();}catch(e){data={};}
  if(!response.ok||!data.reply){
   loading.querySelector("div:first-child").innerText=data.reply||"I couldn't analyze this photo. Please try a clear crop image or describe the problem in text.";
  }else{
   loading.querySelector("div:first-child").innerHTML=formatMarkdown(data.reply);
   if(autoSpeechToggle.checked)speakText(data.reply,data.language||languageSelect.value,loading.querySelector(".tts-btn"));
  }
 }catch(error){
  console.error("Image analysis failed:",error);
  loading.querySelector("div:first-child").innerText="I couldn't connect to the image analysis service. Please try again or describe the crop problem in text.";
 }finally{
  statusText.innerText="";
  imageInput.value="";
 }
}

window.addEventListener("beforeunload",()=>{
 if(recognition){try{recognition.stop();}catch(e){}}
 stopAllSpeech();
});
</script>
</body>
</html>
